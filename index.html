<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff7ed" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1613" media="(prefers-color-scheme: dark)">
  <title>Что приготовить?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo" aria-hidden="true">🍳</span>
      <div>
        <h1>Что приготовить?</h1>
        <p class="tagline">Напиши, что есть дома — подскажу блюдо</p>
      </div>
    </div>
    <button id="settings-open" type="button" class="icon" aria-label="Настройки">⚙</button>
  </header>

  <main>
    <section class="panel">
      <label for="products">Что есть дома</label>
      <textarea id="products" rows="4" placeholder="курица, рис, полбанки сметаны, лук…"></textarea>
      <p id="products-hint" class="hint" hidden>Напиши, что есть дома</p>

      <div class="meal" role="radiogroup" aria-label="Приём пищи">
        <label><input type="radio" name="meal" value="lunch"><span>Обед</span></label>
        <label><input type="radio" name="meal" value="dinner" checked><span>Ужин</span></label>
      </div>

      <button id="suggest" type="button" class="primary">Что приготовить?</button>
    </section>

    <section id="dishes" aria-live="polite"></section>
    <p id="status" class="status" role="status" hidden></p>
    <button id="more" type="button" class="secondary" hidden>Ещё варианты</button>
  </main>

  <dialog id="dish-dialog" aria-labelledby="dish-title">
    <button id="dish-close" type="button" class="icon close" aria-label="Закрыть">✕</button>
    <h2 id="dish-title"></h2>
    <p id="dish-time" class="time"></p>
    <section id="dish-uses-block">
      <h3>Из твоего</h3>
      <ul id="dish-uses" class="chips"></ul>
    </section>
    <section id="dish-missing-block">
      <h3>Не хватает</h3>
      <ul id="dish-missing" class="chips chips-missing"></ul>
    </section>
    <section>
      <h3>Как готовить</h3>
      <ol id="dish-steps" class="steps"></ol>
    </section>
  </dialog>

  <dialog id="settings">
    <form id="settings-form" method="dialog">
      <h2>Настройки</h2>
      <label for="api-key">API-ключ Gemini</label>
      <input id="api-key" type="password" autocomplete="off" spellcheck="false">
      <p class="hint-link">
        <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Получить ключ в Google AI Studio</a>
      </p>
      <button type="submit" class="primary">Сохранить</button>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
